name: Sync Project Dashboard to Notion

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without changing Notion
        type: boolean
        required: false
        default: true
  push:
    branches: [main]
    paths:
      - 'src/project_dashboard_sync.py'
      - '.github/workflows/sync-project-dashboard.yml'
  schedule:
    - cron: "23 0,12 * * *"

permissions:
  contents: read
  statuses: write

concurrency:
  group: notion-project-dashboard
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate secrets
        env:
          GH_PROJECTS_TOKEN: ${{ secrets.GH_PROJECTS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          test -n "$GH_PROJECTS_TOKEN" || (echo "Missing GH_PROJECTS_TOKEN" && exit 1)
          test -n "$NOTION_TOKEN" || (echo "Missing NOTION_TOKEN" && exit 1)
      - name: Sync managed repositories and dashboard
        id: sync
        env:
          GH_PROJECTS_TOKEN: ${{ secrets.GH_PROJECTS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PROJECTS_DATA_SOURCE_ID: 6c2c8677-6f57-41df-8d42-15cd72c2fcea
          NOTION_REPOS_DATA_SOURCE_ID: fcab103c-0318-451d-b9b8-8410dc8c0752
          NOTION_DASHBOARD_PAGE_ID: 3de41bef-3e24-81dc-a0df-e891cc9e001c
          GITHUB_OWNER: greyair
          GITHUB_DISCOVERY_TOPIC: notion-managed
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python src/project_dashboard_sync.py
      - name: Publish safe smoke-test result as commit status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SYNC_MODE: live-write
        run: |
          python - <<'PY'
          import json, os, urllib.request
          ok = os.environ["SYNC_OUTCOME"] == "success"
          payload = {
              "state": "success" if ok else "failure",
              "context": "notion-dashboard/" + os.environ["SYNC_MODE"],
              "description": "Notion sync completed" if ok else "Notion sync failed; inspect Actions run",
              "target_url": "https://github.com/{}/actions/runs/{}".format(os.environ["GH_REPO"], os.environ["GH_RUN_ID"]),
          }
          url = "https://api.github.com/repos/{}/statuses/{}".format(os.environ["GH_REPO"], os.environ["GH_SHA"])
          request = urllib.request.Request(
              url, data=json.dumps(payload).encode(), method="POST",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "X-GitHub-Api-Version": "2022-11-28",
                       "Content-Type": "application/json"})
          with urllib.request.urlopen(request, timeout=30) as response:
              print("Posted smoke validation status:", response.status, payload["state"])
          PY
